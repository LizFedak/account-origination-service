$kind: http-request
name: GET /health — should return healthy service status
url: "{{baseUrl}}/health"
method: GET
headers:
  x-api-key: "{{apiKey}}"
  x-correlation-id: "{{correlationId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('GET /health — should return healthy service status', function () {
        pm.response.to.have.status(200);
      });
      const body = pm.response.json();
      pm.test('Health response includes required fields and correlation ID', function () {
        pm.expect(body.status).to.eql('healthy');
        pm.expect(body.service).to.eql('Account Origination API');
        pm.expect(body.timestamp).to.be.a('string');
        pm.expect(body.correlationId).to.be.a('string');
      });
    language: text/javascript
order: 1000
