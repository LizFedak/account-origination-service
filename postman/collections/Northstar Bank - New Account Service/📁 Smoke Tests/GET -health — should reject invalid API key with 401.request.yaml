$kind: http-request
name: GET /health — should reject invalid API key with 401
url: "{{baseUrl}}/health"
method: GET
headers:
  x-api-key: invalid-key
  x-correlation-id: "{{correlationId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('GET /health — should reject invalid API key with 401', function () {
        pm.response.to.have.status(401);
      });
      const body = pm.response.json();
      pm.test('Unauthorized response uses standard error envelope', function () {
        pm.expect(body).to.have.property('error');
        pm.expect(body.error.code).to.eql('UNAUTHORIZED');
        pm.expect(body.error.correlationId).to.be.a('string');
      });
    language: text/javascript
order: 3001
