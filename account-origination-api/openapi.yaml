openapi: 3.0.3
info:
  title: Account Origination API
  description: Northstar Bank’s Account Origination API enables trusted digital channels and approved fintech partners to submit, track, and manage new retail account applications for checking and savings products. The primary consumers are Northstar’s web and mobile teams, branch-assist tools, and external onboarding partners using a Postman Partner Workspace. The API centralizes application intake, decision status, applicant information, and disclosure consent so the bank can provide a consistent, governed origination experience across channels. It belongs in the API portfolio as the reusable onboarding entry point for retail deposit growth and partner-led acquisition.
  version: 1.0.0
  contact:
    name: Northstar Bank API Platform Team
    email: api-platform@northstarbank.example
    url: https://developer.northstarbank.example
servers:
  - url: http://localhost:3001
    description: Local demo server
security:
  - ApiKeyAuth: []
tags:
  - name: Health
    description: Service health checks for demo operations and monitors.
  - name: Applications
    description: Account origination application lifecycle operations.
paths:
  /health:
    get:
      tags:
        - Health
      summary: Check service health
      description: Returns the health of the Account Origination API. The endpoint is protected so Postman monitors can validate authentication and availability together.
      operationId: get-health
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Healthy service response
                  value:
                    status: healthy
                    service: Account Origination API
                    timestamp: '2026-05-12T15:30:00.000Z'
                    correlationId: corr_demo_123e4567-e89b-12d3-a456-426614174000
        '401':
          $ref: '#/components/responses/Unauthorized'
  /applications:
    get:
      tags:
        - Applications
      summary: List account applications
      description: Returns a filtered list of account applications for operational review, partner status polling, and demo smoke tests.
      operationId: list-applications
      parameters:
        - name: status
          in: query
          required: false
          description: Filter applications by lifecycle status.
          schema:
            type: string
            enum:
              - submitted
              - in_review
              - approved
              - declined
              - cancelled
            example: submitted
        - name: productCode
          in: query
          required: false
          description: Filter applications by requested deposit product.
          schema:
            type: string
            enum:
              - NORTHSTAR_CHECKING
              - NORTHSTAR_SAVINGS
              - NORTHSTAR_PREMIER
            example: NORTHSTAR_CHECKING
        - name: channel
          in: query
          required: false
          description: Filter applications by originating channel.
          schema:
            type: string
            enum:
              - web
              - mobile
              - branch
              - partner
            example: partner
        - name: limit
          in: query
          required: false
          description: Maximum number of applications to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
            example: 10
      responses:
        '200':
          description: Applications were returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationListEnvelope'
              examples:
                submittedApplications:
                  summary: Filtered application list
                  value:
                    data:
                      - id: app_demo_1001
                        status: submitted
                        productCode: NORTHSTAR_CHECKING
                        channel: partner
                        applicant:
                          firstName: Jordan
                          lastName: Lee
                          email: jordan.lee@example.com
                          phone: '+1-555-0101'
                          dateOfBirth: '1990-04-18'
                          ssnLast4: '1234'
                          address:
                            line1: 1200 Market Street
                            city: Denver
                            state: CO
                            postalCode: '80202'
                            country: US
                        employment:
                          employmentStatus: employed
                          annualIncome: 92000
                        funding:
                          initialDepositAmount: 250
                          fundingSource: external_ach
                        consents:
                          privacyPolicyAccepted: true
                          eSignAccepted: true
                        requestedDebitCard: true
                        partnerReferenceId: partner-demo-1001
                        riskTier: low
                        decisionReason: null
                        submittedAt: '2026-05-01T14:35:00.000Z'
                        createdAt: '2026-05-01T14:35:00.000Z'
                        updatedAt: '2026-05-01T14:35:00.000Z'
                    meta:
                      correlationId: corr_demo_123e4567-e89b-12d3-a456-426614174000
                      timestamp: '2026-05-12T15:30:00.000Z'
                      count: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Applications
      summary: Create an account application
      description: Creates a new retail deposit account application and returns the submitted application with a demo risk tier.
      operationId: create-application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
            examples:
              checkingApplication:
                summary: Partner-submitted checking application
                value:
                  productCode: NORTHSTAR_CHECKING
                  channel: partner
                  applicant:
                    firstName: Taylor
                    lastName: Reed
                    email: taylor.reed@example.com
                    phone: '+1-555-0144'
                    dateOfBirth: '1992-07-21'
                    ssnLast4: '4422'
                    address:
                      line1: 200 Park Avenue
                      city: New York
                      state: NY
                      postalCode: '10017'
                      country: US
                  employment:
                    employmentStatus: employed
                    annualIncome: 104000
                  funding:
                    initialDepositAmount: 500
                    fundingSource: external_ach
                  consents:
                    privacyPolicyAccepted: true
                    eSignAccepted: true
                  requestedDebitCard: true
                  partnerReferenceId: partner-demo-2026-0001
      responses:
        '201':
          description: Application was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationEnvelope'
              examples:
                createdApplication:
                  summary: Created account application
                  value:
                    data:
                      id: app_demo_ab12cd34
                      status: submitted
                      productCode: NORTHSTAR_CHECKING
                      channel: partner
                      applicant:
                        firstName: Taylor
                        lastName: Reed
                        email: taylor.reed@example.com
                        phone: '+1-555-0144'
                        dateOfBirth: '1992-07-21'
                        ssnLast4: '4422'
                        address:
                          line1: 200 Park Avenue
                          city: New York
                          state: NY
                          postalCode: '10017'
                          country: US
                      employment:
                        employmentStatus: employed
                        annualIncome: 104000
                      funding:
                        initialDepositAmount: 500
                        fundingSource: external_ach
                      consents:
                        privacyPolicyAccepted: true
                        eSignAccepted: true
                      requestedDebitCard: true
                      partnerReferenceId: partner-demo-2026-0001
                      riskTier: low
                      decisionReason: null
                      submittedAt: '2026-05-12T15:31:00.000Z'
                      createdAt: '2026-05-12T15:31:00.000Z'
                      updatedAt: '2026-05-12T15:31:00.000Z'
                    meta:
                      correlationId: corr_demo_123e4567-e89b-12d3-a456-426614174000
                      timestamp: '2026-05-12T15:31:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /applications/{application-id}:
    get:
      tags:
        - Applications
      summary: Retrieve an account application
      description: Retrieves one account application by its Northstar application identifier.
      operationId: get-application-by-id
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Application was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationEnvelope'
              examples:
                application:
                  summary: Retrieved application
                  value:
                    data:
                      id: app_demo_1001
                      status: submitted
                      productCode: NORTHSTAR_CHECKING
                      channel: partner
                      applicant:
                        firstName: Jordan
                        lastName: Lee
                        email: jordan.lee@example.com
                        phone: '+1-555-0101'
                        dateOfBirth: '1990-04-18'
                        ssnLast4: '1234'
                        address:
                          line1: 1200 Market Street
                          city: Denver
                          state: CO
                          postalCode: '80202'
                          country: US
                      employment:
                        employmentStatus: employed
                        annualIncome: 92000
                      funding:
                        initialDepositAmount: 250
                        fundingSource: external_ach
                      consents:
                        privacyPolicyAccepted: true
                        eSignAccepted: true
                      requestedDebitCard: true
                      partnerReferenceId: partner-demo-1001
                      riskTier: low
                      decisionReason: null
                      submittedAt: '2026-05-01T14:35:00.000Z'
                      createdAt: '2026-05-01T14:35:00.000Z'
                      updatedAt: '2026-05-01T14:35:00.000Z'
                    meta:
                      correlationId: corr_demo_123e4567-e89b-12d3-a456-426614174000
                      timestamp: '2026-05-12T15:32:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Applications
      summary: Cancel an account application
      description: Cancels a submitted or in-review application. The demo keeps the record in memory and marks it cancelled for audit-friendly workflow demonstrations.
      operationId: cancel-application
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Application was cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationEnvelope'
              examples:
                cancelledApplication:
                  summary: Cancelled application
                  value:
                    data:
                      id: app_demo_1001
                      status: cancelled
                      productCode: NORTHSTAR_CHECKING
                      channel: partner
                      applicant:
                        firstName: Jordan
                        lastName: Lee
                        email: jordan.lee@example.com
                        phone: '+1-555-0101'
                        dateOfBirth: '1990-04-18'
                        ssnLast4: '1234'
                        address:
                          line1: 1200 Market Street
                          city: Denver
                          state: CO
                          postalCode: '80202'
                          country: US
                      employment:
                        employmentStatus: employed
                        annualIncome: 92000
                      funding:
                        initialDepositAmount: 250
                        fundingSource: external_ach
                      consents:
                        privacyPolicyAccepted: true
                        eSignAccepted: true
                      requestedDebitCard: true
                      partnerReferenceId: partner-demo-1001
                      riskTier: low
                      decisionReason: Application cancelled by request.
                      submittedAt: '2026-05-01T14:35:00.000Z'
                      createdAt: '2026-05-01T14:35:00.000Z'
                      updatedAt: '2026-05-12T15:33:00.000Z'
                    meta:
                      correlationId: corr_demo_123e4567-e89b-12d3-a456-426614174000
                      timestamp: '2026-05-12T15:33:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidStatusTransition'
  /applications/{application-id}/status:
    patch:
      tags:
        - Applications
      summary: Update account application status
      description: Advances an application through the demo lifecycle of submitted, in review, approved, declined, or cancelled.
      operationId: update-application-status
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationStatusRequest'
            examples:
              moveToReview:
                summary: Move application into review
                value:
                  status: in_review
                  decisionReason: Identity verification queued for operations review.
      responses:
        '200':
          description: Application status was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationEnvelope'
              examples:
                inReviewApplication:
                  summary: Updated application status
                  value:
                    data:
                      id: app_demo_1001
                      status: in_review
                      productCode: NORTHSTAR_CHECKING
                      channel: partner
                      applicant:
                        firstName: Jordan
                        lastName: Lee
                        email: jordan.lee@example.com
                        phone: '+1-555-0101'
                        dateOfBirth: '1990-04-18'
                        ssnLast4: '1234'
                        address:
                          line1: 1200 Market Street
                          city: Denver
                          state: CO
                          postalCode: '80202'
                          country: US
                      employment:
                        employmentStatus: employed
                        annualIncome: 92000
                      funding:
                        initialDepositAmount: 250
                        fundingSource: external_ach
                      consents:
                        privacyPolicyAccepted: true
                        eSignAccepted: true
                      requestedDebitCard: true
                      partnerReferenceId: partner-demo-1001
                      riskTier: low
                      decisionReason: Identity verification queued for operations review.
                      submittedAt: '2026-05-01T14:35:00.000Z'
                      createdAt: '2026-05-01T14:35:00.000Z'
                      updatedAt: '2026-05-12T15:34:00.000Z'
                    meta:
                      correlationId: corr_demo_123e4567-e89b-12d3-a456-426614174000
                      timestamp: '2026-05-12T15:34:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidStatusTransition'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key issued by the Northstar Bank API Platform Team.
  parameters:
    ApplicationId:
      name: application-id
      in: path
      required: true
      description: Unique account application identifier.
      schema:
        type: string
        example: app_demo_1001
  responses:
    Unauthorized:
      description: API key was missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unauthorized:
              summary: Invalid API key
              value:
                error:
                  code: UNAUTHORIZED
                  message: Missing or invalid x-api-key header.
                  correlationId: corr_demo_123e4567-e89b-12d3-a456-426614174000
    ValidationError:
      description: Request payload failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            validationError:
              summary: Missing required field
              value:
                error:
                  code: VALIDATION_ERROR
                  message: 'Missing required fields: applicant.email.'
                  correlationId: corr_demo_123e4567-e89b-12d3-a456-426614174000
    NotFound:
      description: Application was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            notFound:
              summary: Unknown application
              value:
                error:
                  code: APPLICATION_NOT_FOUND
                  message: Application app_demo_missing was not found.
                  correlationId: corr_demo_123e4567-e89b-12d3-a456-426614174000
    InvalidStatusTransition:
      description: Requested lifecycle transition is not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalidTransition:
              summary: Terminal application cannot be reopened
              value:
                error:
                  code: INVALID_STATUS_TRANSITION
                  message: Cannot transition application app_demo_1003 from approved to submitted.
                  correlationId: corr_demo_123e4567-e89b-12d3-a456-426614174000
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - timestamp
        - correlationId
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: Account Origination API
        timestamp:
          type: string
          format: date-time
          example: '2026-05-12T15:30:00.000Z'
        correlationId:
          type: string
          example: corr_demo_123e4567-e89b-12d3-a456-426614174000
    Meta:
      type: object
      required:
        - correlationId
        - timestamp
      properties:
        correlationId:
          type: string
          example: corr_demo_123e4567-e89b-12d3-a456-426614174000
        timestamp:
          type: string
          format: date-time
          example: '2026-05-12T15:30:00.000Z'
        count:
          type: integer
          example: 3
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      required:
        - code
        - message
        - correlationId
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Human-readable message
        correlationId:
          type: string
          example: corr_demo_123e4567-e89b-12d3-a456-426614174000
    ApplicationEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/Application'
        meta:
          $ref: '#/components/schemas/Meta'
    ApplicationListEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Application'
          example:
            - id: app_demo_1001
              status: submitted
              productCode: NORTHSTAR_CHECKING
              channel: partner
              applicant:
                firstName: Jordan
                lastName: Lee
                email: jordan.lee@example.com
                phone: '+1-555-0101'
                dateOfBirth: '1990-04-18'
                ssnLast4: '1234'
                address:
                  line1: 1200 Market Street
                  city: Denver
                  state: CO
                  postalCode: '80202'
                  country: US
              employment:
                employmentStatus: employed
                annualIncome: 92000
              funding:
                initialDepositAmount: 250
                fundingSource: external_ach
              consents:
                privacyPolicyAccepted: true
                eSignAccepted: true
              requestedDebitCard: true
              partnerReferenceId: partner-demo-1001
              riskTier: low
              decisionReason: null
              submittedAt: '2026-05-01T14:35:00.000Z'
              createdAt: '2026-05-01T14:35:00.000Z'
              updatedAt: '2026-05-01T14:35:00.000Z'
        meta:
          $ref: '#/components/schemas/Meta'
    CreateApplicationRequest:
      type: object
      required:
        - productCode
        - applicant
        - consents
      properties:
        productCode:
          type: string
          enum:
            - NORTHSTAR_CHECKING
            - NORTHSTAR_SAVINGS
            - NORTHSTAR_PREMIER
          example: NORTHSTAR_CHECKING
        channel:
          type: string
          enum:
            - web
            - mobile
            - branch
            - partner
          example: partner
        applicant:
          $ref: '#/components/schemas/Applicant'
        employment:
          $ref: '#/components/schemas/Employment'
        funding:
          $ref: '#/components/schemas/Funding'
        consents:
          $ref: '#/components/schemas/Consents'
        requestedDebitCard:
          type: boolean
          example: true
        partnerReferenceId:
          type: string
          example: partner-demo-2026-0001
    UpdateApplicationStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - submitted
            - in_review
            - approved
            - declined
            - cancelled
          example: in_review
        decisionReason:
          type: string
          example: Identity verification queued for operations review.
    Application:
      type: object
      required:
        - id
        - status
        - productCode
        - channel
        - applicant
        - employment
        - funding
        - consents
        - requestedDebitCard
        - partnerReferenceId
        - riskTier
        - decisionReason
        - submittedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          example: app_demo_1001
        status:
          type: string
          enum:
            - submitted
            - in_review
            - approved
            - declined
            - cancelled
          example: submitted
        productCode:
          type: string
          example: NORTHSTAR_CHECKING
        channel:
          type: string
          example: partner
        applicant:
          $ref: '#/components/schemas/Applicant'
        employment:
          $ref: '#/components/schemas/Employment'
        funding:
          $ref: '#/components/schemas/Funding'
        consents:
          $ref: '#/components/schemas/Consents'
        requestedDebitCard:
          type: boolean
          example: true
        partnerReferenceId:
          type: string
          nullable: true
          example: partner-demo-1001
        riskTier:
          type: string
          enum:
            - low
            - standard
            - review
          example: low
        decisionReason:
          type: string
          nullable: true
          example: Identity verification queued for operations review.
        submittedAt:
          type: string
          format: date-time
          example: '2026-05-01T14:35:00.000Z'
        createdAt:
          type: string
          format: date-time
          example: '2026-05-01T14:35:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-05-01T14:35:00.000Z'
    Applicant:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phone
        - dateOfBirth
        - ssnLast4
        - address
      properties:
        firstName:
          type: string
          example: Jordan
        lastName:
          type: string
          example: Lee
        email:
          type: string
          format: email
          example: jordan.lee@example.com
        phone:
          type: string
          example: '+1-555-0101'
        dateOfBirth:
          type: string
          format: date
          example: '1990-04-18'
        ssnLast4:
          type: string
          pattern: '^\d{4}$'
          example: '1234'
        address:
          $ref: '#/components/schemas/Address'
    Address:
      type: object
      required:
        - line1
        - city
        - state
        - postalCode
        - country
      properties:
        line1:
          type: string
          example: 1200 Market Street
        city:
          type: string
          example: Denver
        state:
          type: string
          example: CO
        postalCode:
          type: string
          example: '80202'
        country:
          type: string
          example: US
    Employment:
      type: object
      required:
        - employmentStatus
        - annualIncome
      properties:
        employmentStatus:
          type: string
          enum:
            - employed
            - self_employed
            - retired
            - student
            - not_provided
          example: employed
        annualIncome:
          type: number
          format: double
          example: 92000
    Funding:
      type: object
      required:
        - initialDepositAmount
        - fundingSource
      properties:
        initialDepositAmount:
          type: number
          format: double
          example: 250
        fundingSource:
          type: string
          enum:
            - external_ach
            - debit_card
            - wire
            - cash
            - not_provided
          example: external_ach
    Consents:
      type: object
      required:
        - privacyPolicyAccepted
        - eSignAccepted
      properties:
        privacyPolicyAccepted:
          type: boolean
          example: true
        eSignAccepted:
          type: boolean
          example: true
