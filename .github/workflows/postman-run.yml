name: API Quality Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  postman-api-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman
        run: postman login --with-api-key "${{ secrets.POSTMAN_API_KEY }}"

      - name: Lint OpenAPI spec
        run: postman spec lint openapi.yaml --report-events

      - name: Run Postman collection
        run: postman collection run 9474696-11099a3c-5db7-4d8f-a9b5-77397bb6c0f0 -i 9474696-70869172-448a-4a54-ac7f-b849cd87b9d5 --report-events